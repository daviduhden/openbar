# openbar configuration file (~/.openbarrc)
#
# cwm-style keyword format.  Lines starting with '#' are comments.
# Strings with spaces must be quoted: "my logo text"

# Bar dimensions
barheight 24
gap 0 0 0 0

# Colors (Xft color names or #RRGGBB)
color barbg "#CCCCCC"
color barfg "#000000"
color urgent "#FC8814"

# Font (Xft fontconfig pattern)
fontname "sans-serif:pixelsize=14:bold"

# Logo text displayed on the bar
logo OpenBar

# Network interface for private IP
interface iwm0

# Widget display toggles
show hostname
show date
show cpu
show mem
show load
show net
show vpn
hide bat
