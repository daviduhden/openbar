# openbar configuration file
#
# Installed as /etc/openbarrc; copy it to ~/.openbarrc for a per-user
# configuration.  cwm-style keyword format.  Lines whose first non-space
# character is '#' are comments; there are no inline comments.

# Bar dimensions
barheight 24
gap 0 0 0 0

# Colors (Xft color names or #RRGGBB)
color barbg "#CCCCCC"
color barfg "#000000"
color urgent "#FC8814"

# Font (Xft fontconfig pattern)
fontname "sans-serif:pixelsize=14:bold"

# Logo text displayed on the bar
logo OpenBar

# Preferred network interface for the interface IPv4 address
interface iwm0

# Widget display toggles
show hostname
show date
show cpu
show mem
show load
show vpn
show net
hide bat
